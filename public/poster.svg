  <!-- title -->
  <text x="200" y="155" text-anchor="middle" fill="white" font-family="system-ui,sans-serif" font-size="18" font-weight="700" letter-spacing="0.5">M3U &amp; TorBox</text>
  <text x="200" y="178" text-anchor="middle" fill="#a0a0b8" font-family="system-ui,sans-serif" font-size="11" letter-spacing="0.3">Stremio Playlist Addon</text>
